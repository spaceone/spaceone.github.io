include /etc/ldap/schema/core.schema
include /etc/ldap/schema/cosine.schema
include /etc/ldap/schema/nis.schema
include /etc/ldap/schema/inetorgperson.schema
include ./freeiam-example.schema

moduleload back_mdb

database mdb
suffix "dc=freeiam,dc=org"
rootdn "cn=admin,dc=freeiam,dc=org"
rootpw "iamfree"

add_content_acl on

directory ./db/

access to filter="objectClass=person" attrs="objectClass" val.exact="inetOrgPerson"
    by self write stop
    by * +0 break

access to filter="objectClass=person" attrs="objectClass"
    by self +0 stop
    by * +0 break

access to filter="objectClass=person" attrs="entry,@inetOrgPerson"
    by self write stop
    by * +0 break

access to dn.subtree="dc=freeiam,dc=org" attrs=entry,userPassword
    by anonymous auth
    by * none stop

access to *
    by * none stop
