include /etc/ldap/schema/core.schema
include /etc/ldap/schema/cosine.schema
include /etc/ldap/schema/nis.schema
include /etc/ldap/schema/inetorgperson.schema

moduleload back_mdb

database mdb
suffix "dc=freeiam,dc=org"
rootdn "cn=admin,dc=freeiam,dc=org"
rootpw "iamfree"

add_content_acl off  # the default - this line will be replaced via sed!

directory ./db/

access to dn.base="cn=server1,ou=servers,dc=freeiam,dc=org" attrs=entry,userPassword
    by anonymous auth
    by * none stop

access to dn.base="ou=managed,dc=freeiam,dc=org" attrs=children
    by dn.exact="cn=server1,ou=servers,dc=freeiam,dc=org" write
    by * none stop

# memberserver may only create "device" objects here
access to dn.onelevel="ou=managed,dc=freeiam,dc=org" attrs=entry,@device
    by dn.exact="cn=server1,ou=servers,dc=freeiam,dc=org" write
    by * none stop

# similar, alternative structure:
# access to dn.subtree="ou=managed,dc=freeiam,dc=org" attrs=entry,children
#     by dn.exact="cn=server1,ou=servers,dc=freeiam,dc=org" write
#     by * none stop
#
# access to dn.onelevel="ou=managed,dc=freeiam,dc=org" filter="(objectClass=device)" attrs=entry,@device
#     by dn.exact="cn=server1,ou=servers,dc=freeiam,dc=org" write
#     by * none stop

access to *
    by * none stop
